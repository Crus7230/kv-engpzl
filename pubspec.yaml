name: kvm
description: "KVs Math Adventure 2026 renewal prototype."
publish_to: 'none'
version: 0.1.10+11

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Development/web/offline bundle. Public Android updates are built from
  # tool/prepare_logic_only_source.ps1, which excludes all retained media.
  assets:
    - assets/legacy/
    - assets/expedition/
    - assets/asset_manifest.json
    - assets/audio/
    - assets/audio_manifest.json
